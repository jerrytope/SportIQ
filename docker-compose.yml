services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sportiq
      POSTGRES_USER: sportiq
      POSTGRES_PASSWORD: sportiq
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://sportiq:sportiq@db:5432/sportiq
      CELERY_BROKER_URL: redis://redis:6379/0
    command: sh -c "python manage.py migrate --noinput && gunicorn sportiq.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    ports: ["8000:8000"]
    volumes: [media:/app/media]
    depends_on: [db, redis]

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://sportiq:sportiq@db:5432/sportiq
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery -A sportiq worker -l info
    volumes: [media:/app/media]
    depends_on: [db, redis]

  beat:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://sportiq:sportiq@db:5432/sportiq
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery -A sportiq beat -l info
    depends_on: [db, redis]

volumes:
  pgdata:
  media:
