{% load sportiq %}{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pages">
  {% if page.has_previous %}<a href="{% qs page=page.previous_page_number %}">← Previous</a>{% endif %}
  <span class="current">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="{% qs page=page.next_page_number %}">Next →</a>{% endif %}
</nav>
{% endif %}
