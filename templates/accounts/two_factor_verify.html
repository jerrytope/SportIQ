{% extends "public/base.html" %}
{% block title %}Two-factor check · SportIQ{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="card auth-card">
  <h1 style="font-size:1.6rem">Enter your security code</h1>
  <p class="muted">Open your authenticator app and enter the 6-digit code for SportIQ.</p>
  <form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
    {% include "components/form.html" %}
    <button class="btn btn-primary btn-block" type="submit">Continue</button>
  </form>
</div></section>
{% endblock %}
