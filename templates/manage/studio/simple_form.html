{% extends "manage/base.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-title"><div><div class="breadcrumbs"><a href="{% url 'backoffice:course_builder' back %}">Back to course</a></div><h1>{{ title }}</h1>{% if help %}<p>{{ help }}</p>{% endif %}</div></div>
<form class="card" method="post" enctype="multipart/form-data" style="max-width:860px">{% csrf_token %}
  {% include "components/form.html" with grid=True %}
  <div class="row"><button class="btn btn-primary" name="action" value="save">Save</button>
    {% if delete %}<button class="btn btn-danger" name="action" value="delete" data-confirm="Click again to delete">Delete</button>{% endif %}</div>
</form>
{% endblock %}
